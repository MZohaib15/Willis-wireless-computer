<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Willis Wireless & Computer Repairs</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #000;
            color: #fff;
            text-align: center;
        }
        header {
            padding: 0;
            text-align: center;
        }
        header img {
            width: 60%;
            height: 20vh;
            display: block;
            margin: 0 auto;
        }
        .additional-image {
            width: 55%;
            height: 20vh;
            display: block;
            margin: 20px auto 80px auto; /* Default spacing for larger screens */
        }
        .content {
            padding: 20px;
            padding-bottom: 60px; /* Add padding to ensure content is above footer */
        }
        .content h2 {
            color: #ff0000;
            margin-bottom: 10px;
        }
        footer {
            background-color: #333;
            color: white;
            padding: 10px 0;
            position: fixed;
            width: 100%;
            bottom: 0;
        }
        .slideshow-container {
            width: 55%;
            position: relative;
            margin: 20px auto;
            border: 3px solid #fff; /* Changed border color to white */
            overflow: hidden; /* Ensure any overflowed image parts are hidden */
        }
        .slides {
            display: none;
            width: 100%;
            height: 100%; /* Ensures the images fill the container's height */
        }
        .slideshow-container img {
            width: 100%; /* Ensures the images fill the container's width */
            height: 100%; /* Ensures the images fill the container's height */
            object-fit: cover; /* Ensures images maintain their aspect ratio while covering the entire container */
        }

        /* Media Queries for Mobile Devices */
        @media only screen and (max-width: 768px) {
            header img {
                width: 80%;  /* Adjust logo size for smaller screens */
                height: auto;
            }
            .slideshow-container {
                width: 100%; /* Slideshow container should take up 100% of the width */
                margin: 10px auto; /* Reduced margin for slideshow */
            }
            .additional-image {
                width: 90%; /* Increase the width of the additional image */
                height: auto; /* Let the height adjust automatically */
                margin: 10px auto 80px auto; /* More space before footer */
            }
            footer {
                padding: 5px 0; /* Reduce footer padding for mobile */
            }
            .content {
                padding-bottom: 100px; /* Add more padding to content to prevent footer overlap */
            }
        }

        /* Media Queries for Laptop & Larger Devices */
        @media only screen and (min-width: 769px) {
            .slideshow-container {
                width: 60%; /* Keep slideshow at 60% for larger screens */
                margin: 20px auto; /* Keep consistent margin for slideshow */
            }
            .additional-image {
                width: 60%; /* Increase the width of the additional image for larger devices */
                height: auto; /* Let the height adjust automatically */
                margin: 30px auto 100px auto; /* Increase space before footer for laptops/desktops */
            }
            footer {
                padding: 10px 0; /* Keep footer padding larger for desktop and laptop */
            }
            .content {
                padding-bottom: 120px; /* Add more padding for content to ensure footer does not overlap */
            }
        }
    </style>
    <script>
        let slideIndex = 0;
        function showSlides() {
            const slides = document.querySelectorAll(".slides");
            slides.forEach(slide => (slide.style.display = "none"));
            slideIndex++;
            if (slideIndex > slides.length) {
                slideIndex = 1;
            }
            slides[slideIndex - 1].style.display = "block";
            setTimeout(showSlides, 3000); // Change image every 3 seconds
        }
        window.onload = showSlides;
    </script>
</head>
<body>
    <header>
        <img src="logo.jpg" alt="Willis Wireless & Computer Repairs Logo">
    </header>
    <div class="content">
        <div class="slideshow-container">
            <img src="image1.jpg" alt="Slide 1" class="slides">
            <img src="image2.jpg" alt="Slide 2" class="slides">
            <img src="image3.jpg" alt="Slide 3" class="slides">
        </div>
    </div>
    <img src="additional_image.jpg" alt="Additional Image" class="additional-image">
    <footer>
        <p>&copy; 2025 Willis Wireless & Computer Repairs</p>
    </footer>
</body>
</html>
